{% extends 'base_auth.html' %}
{% load static %}
{% block content %}
    <div class="row">
        <div class="col-md-4"></div>

        <div class="col-md-4">
            <div class="card mt-5">
                <div class="card-body">

                    <div class="card-title py-3">
                        <h4>Set your new password</h4>
                    </div>

                    <form action="{% url 'reset-user-password' uidb64 token %}" method="post">
                        {% csrf_token %}

                        {% include 'partials/_messages.html' %}

                        <div class="form-group py-2">
                            <input type="password" name="password" id="passwordField" placeholder="Password" class="form-control form-control-sm">
                            <small class="float-end py-3 showPasswordToggle">SHOW</small>
                        </div>
                        <div class="form-group py-2">
                            <input type="password" name="password2" id="passwordField2" placeholder="Confirm Password" class="form-control form-control-sm">
                            <small class="float-end py-3 showPasswordToggle2">SHOW</small>
                        </div>

                        <input type="submit" value="Submit" class="btn btn-primary w-100 submit-btn">
                    </form>

                    <div class="container">
                        <p class="text-lead lead">Have an account? <a href="{% url 'login' %}">Login here</a></p>
                        <p class="text-lead lead">Don`t have an account? <a href="{% url 'register' %}">Register here</a></p>
                    </div>
        
                </div>
            </div>
        </div>

        <div class="col-md-4"></div>
    </div>
    <script src="{% static 'js/set_new_password.js' %}"></script>
{% endblock %}
