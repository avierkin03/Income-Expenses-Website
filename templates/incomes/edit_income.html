{% extends 'base.html' %}
{% block content %}
    <div class="container mt-4">
        
        <div class="row">
            <div class="col-md-10">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="{% url 'incomes' %}">Income</a></li>
                        <li class="breadcrumb-item active" aria-current="page">Edit Income</li>
                    </ol>
                </nav>
            </div>
            <div class="col-md-2">
                <a href="{% url 'delete-income' income.id %}" class="btn btn-danger btn-sm">Delete</a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <form action="{% url 'edit-income' income.id %}" method="post">
                    {% include 'partials/_messages.html' %}
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" value="{{ income.amount }}" class="form-control form-control-sm" id="amount" name="amount" placeholder="Enter amount" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" value="{{ income.description }}" class="form-control form-control-sm" id="description" name="description" placeholder="Enter description" required>
                    </div>
                    <div class="form-group">
                        <label for="source">Source</label>
                        <select class="form-control form-control-sm" id="source" name="source" required>
                            <option value="{{ income.source }}" selected>{{ income.source }}</option>
                            {% for source in sources %}
                                {% if source.name != income.source %}
                                    <option value="{{ source.name }}">{{ source.name }}</option>
                                {% endif %}
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date of Income</label>
                        <input type="date" value="{{ income.date |date:'Y-m-d' }}" class="form-control form-control-sm" id="date" name="income_date" required>
                    </div>
                    <input type="submit" value="Update Income" class="btn btn-primary btn-primary-sm mt-2">
                </form>
            </div>
        </div>
    </div>
{% endblock %}
