{% extends 'base.html' %}
{% block content %}
    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'incomes' %}">Income</a></li>
                <li class="breadcrumb-item active" aria-current="page">Add Income</li>
            </ol>
        </nav>

        
        <div class="card">
            <div class="card-body">
                <form action="{% url 'add-income'%}" method="post">
                    {% include 'partials/_messages.html' %}
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" value="{{ values.amount }}" class="form-control form-control-sm" id="amount" name="amount" placeholder="Enter amount" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" value="{{ values.description }}" class="form-control form-control-sm" id="description" name="description" placeholder="Enter description" required>
                    </div>
                    <div class="form-group">
                        <label for="source">Sources</label>
                        <select class="form-control form-control-sm" id="source" name="source" required>
                            <option value="" disabled selected>Select source</option>
                            {% for source in sources %}
                                <option value="{{ source.name }}">{{ source.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date">Date of Income</label>
                        <input type="date" class="form-control form-control-sm" id="date" name="income_date" required>
                    </div>
                    <input type="submit" value="Add Income" class="btn btn-primary btn-primary-sm mt-2">
                </form>
            </div>
        </div>
    </div>
{% endblock %}
